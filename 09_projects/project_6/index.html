<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Counter</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f1f5f8;
            margin: 0;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            transition: color 0.2s;
        }
        .btn-container {
            display: flex;
            gap: 1rem;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid #222;
            background: transparent;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s linear;
        }
        button:hover {
            background: #222;
            color: white;
        }
        .decrease { border-color: #ff6b6b; color: #ff6b6b; }
        .decrease:hover { background: #ff6b6b; color: white; }
        
        .increase { border-color: #51cf66; color: #51cf66; }
        .increase:hover { background: #51cf66; color: white; }
    </style>
</head>

<body>

    <h1 id="value">0</h1>

    <div class="btn-container">
        <button class="decrease">Decrease</button>
        <button class="reset">Reset</button>
        <button class="increase">Increase</button>
    </div>

<script>
    // 1. Set initial state
    let count = 0;

    // 2. Select elements
    const value = document.querySelector("#value");
    const btns = document.querySelectorAll("button");

    // 3. Loop through all buttons to add listeners
    // (Instead of selecting each button individually)
    btns.forEach(function (btn) {
        btn.addEventListener("click", function (e) {
            // Get the class of the clicked button
            const styles = e.currentTarget.classList;

            // Logic to change the count variable
            if (styles.contains("decrease")) {
                count--;
            } else if (styles.contains("increase")) {
                count++;
            } else {
                count = 0;
            }

            // Logic to change the color
            if (count > 0) {
                value.style.color = "#51cf66"; // Green
            }
            if (count < 0) {
                value.style.color = "#ff6b6b"; // Red
            }
            if (count === 0) {
                value.style.color = "#222"; // Black
            }

            // Update the text
            value.textContent = count;
        });
    });
</script>

</body>
</html>


<!-- Key Concepts Applied
Global Variables (let count = 0): This variable lives outside the functions, allowing it to "remember" the number between clicks.

querySelectorAll & forEach: Instead of writing three separate click listeners (one for each button), we selected all buttons and looped through them. This makes your code cleaner and scalable.

e.currentTarget.classList: We checked which button was clicked by looking at its CSS classes.

Conditionals: Used to determine color changes dynamically. -->
