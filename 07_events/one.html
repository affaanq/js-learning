<body style="background-color: #414141; color: aliceblue;">

            <li><img width="200px" id="photoshop" src="https://images.pexels.com/photos/3561339/pexels-photo-3561339.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="photoshop"></li>
            <li><img width="200px" id="japan" src="https://images.pexels.com/photos/3532553/pexels-photo-3532553.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>

             <li><img width="200px" id="owl" src="https://images.pexels.com/photos/3532552/pexels-photo-3532552.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="" onclick="alert('owl')" ></li> <!--// very bad approach of using onlick like that -->

        </ul>
   </div>

<script>

    // event only works for a specific event in the browser
    // document.getElementById('owl').onclick = function(){
    //     alert("owl clicked") 
    // }  This is a much better approach for owl but onclick may cause some problems(less features), use event listner instead..

    // this is used in early time when it was very defficult to use in internet explorer
     // attachEvent()

    // jQuery - on

    // type, timestamp, defaultPrevented
    // target, toElement, srcElement, currentTarget,
    // clientX, clientY, screenX, screenY
    // altkey, ctrlkey, shiftkey, keyCode

    // document.getElementById('images').addEventListener('click', function(e){
    //     console.log("clicked inside the ul");
    // }, false)

    // this is the best alternative for onclick...
     document.getElementById('owl').addEventListener('click', function(e){
        // alert("Owl Tapped")
         console.log("owl clicked");
         e.stopPropagation()
     }, false) // the false is default, it is for event bubbling which is the industry default, True is event caputuring 
     // event bubbling: from bottom to top..First owl clicked be printed and then clicked inside the ul.. this is called event propagation.
    
     // Event capturing is the opposite of event bubbling..


    // document.getElementById('google').addEventListener('click',function(e){
    //     e.preventDefault(); // it will not take to the google url..
    //     e.stopPropagation() // it will stop the execution
    //     console.log("google clicked");
    // }, false)
   
    
    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.tagName); // distinguishes IMG from LI
        if (e.target.tagName === 'IMG') { // will no remove all the images when li is clicked.
            console.log(e.target.id);
            let removeIt = e.target.parentNode // If we want to remove the parent of the target...
            removeIt.remove()
        }
    
        
    })
    
    //removeIt.parentNode.removeChild(removeIt) this is an alternative to like 65
</script>
