    <h1>Affaan</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>

<script>
    //setInterval() // this function will continously print the value to the console after the given interval..   
    setInterval(function(){
        console.log("Affaan", Date.now()); // set interval has also a argument variable...
        
    }, 1000)

    const sayMyName = function(str){
        console.log(str, Date.now());

    }

    const myId = setInterval(sayMyName, 1000, "The time is ")

    // To stop the set interval we use: clearInterval()

    clearInterval(myId)
</script>
