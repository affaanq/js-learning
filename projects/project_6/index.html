<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Counter</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f1f5f8;
            margin: 0;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            transition: color 0.2s;
        }
        .btn-container {
            display: flex;
            gap: 1rem;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid #222;
            background: transparent;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s linear;
        }
        button:hover {
            background: #222;
            color: white;
        }
        .decrease { border-color: #ff6b6b; color: #ff6b6b; }
        .decrease:hover { background: #ff6b6b; color: white; }
        
        .increase { border-color: #51cf66; color: #51cf66; }
        .increase:hover { background: #51cf66; color: white; }
    </style>
</head>
