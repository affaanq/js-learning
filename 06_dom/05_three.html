<body style="background-color: #212121; color: #ffff;">
    
</body>

<script>
    const div = document.createElement("div")
    console.log(div);
    div .className = "main"
    div.id = Math.floor(Math.random() * 10 + 1)
    div.setAttribute("title", "generated title") // we prefer this method the most as it overwrite the value 
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    div.innerText = "Coding"
    const content = document.createTextNode("Coding") // this is preferred over the other own
    div.appendChild(content) // but this is a longer method to do the same thing at line 21
    
    

    document.body.appendChild(div) // this is very important it attaches a child to the body, always need to do it in the very end
</script>
</html>
