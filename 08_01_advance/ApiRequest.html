<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style = "background-color: #212121">

0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete.
    
</body>

    <script>
        const requestUrl = "https://api.github.com/users/affaanq"

        const xhr = new XMLHttpRequest(); // we use to recieve and send data via it..
        // console.log(xhr.readyState);
        xhr.open("GET", requestUrl) // takes two parameter, method and a string....it will not track the request continously
        xhr.onreadystatechange = function (){

            console.log(xhr.readyState);

            if (xhr.readyState === 4) {
                const data = JSON.parse(this.responseText) // it converts the string to the JSON type...
                console.log(data.followers); // it will print all the log in details of thee user when readyState becomes 4
            } // every time the response which comes from the url is in the form of a String and not the object.. so using data.followers does not work
            
        } 
        xhr.send(); // this is very important as open() does not send the url on its own we have to type in send()

    </script>
</html>
